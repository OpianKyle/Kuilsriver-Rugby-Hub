openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: fundraising
    description: Public fundraising campaign data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /fundraising/summary:
    get:
      operationId: getFundraisingSummary
      tags: [fundraising]
      summary: Get verified fundraising progress
      description: Returns the goal and totals from confirmed donations only
      responses:
        "200":
          description: Current fundraising progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FundraisingSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FundraisingSummary:
      type: object
      properties:
        goalAmount:
          type: number
        raisedAmount:
          type: number
        progressPercent:
          type: number
        verifiedDonationCount:
          type: integer
      required:
        - goalAmount
        - raisedAmount
        - progressPercent
        - verifiedDonationCount

